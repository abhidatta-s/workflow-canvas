<text x="64" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">pointer events, SVG bezier edges</text>
<text x="64" y="268" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">8 px grid, 2400 x 1600 surface</text>
<rect x="48" y="290" width="232" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="64" y="316" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">Inspector</text>
<text x="64" y="336" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">label and per-type config</text>
<rect x="340" y="160" width="260" height="96" rx="10" fill="#23273b" stroke="#6366f1" stroke-width="1.5"/>
<rect x="340" y="170" width="3" height="76" rx="1.5" fill="#a5b4fc"/>
<text x="356" y="186" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="start">reducer.ts</text>
<text x="356" y="206" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">add, move, connect, label,</text>
<text x="356" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">config, delete, load</text>
<text x="356" y="242" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">one Workflow state object</text>
<rect x="340" y="290" width="260" height="112" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="356" y="316" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">graph.ts rules</text>
<text x="356" y="336" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">reject self-links and duplicates</text>
<text x="356" y="354" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">reject loops (reachability check)</text>
<text x="356" y="372" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">flag missing trigger and</text>
<text x="356" y="390" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">unconnected branches</text>
