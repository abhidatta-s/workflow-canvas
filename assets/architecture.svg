<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Workflow Canvas architecture: palette, canvas and inspector dispatch actions to a reducer; graph rules guard connections; state feeds a live JSON preview and autosaves to localStorage.">
<title>Workflow Canvas architecture: palette, canvas and inspector dispatch actions to a reducer; graph rules guard connections; state feeds a live JSON preview and autosaves to localStorage.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a5b4fc"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#151722"/>
<text x="32" y="44" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#e6e8f0" text-anchor="start">Workflow Canvas</text>
<text x="32" y="68" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#a3acc2" text-anchor="start">A visual editor that produces workflow JSON. It builds and validates graphs; it does not execute them.</text>
<rect x="24" y="84" width="912" height="362" rx="12" fill="none" stroke="#3a3f5c" stroke-dasharray="4 4"/>
<text x="38" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#7c869f" text-anchor="start">BROWSER  (REACT 18 + VITE + TYPESCRIPT, NO GRAPH LIBRARY)</text>
<rect x="48" y="118" width="232" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
