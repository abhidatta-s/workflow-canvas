<text x="64" y="164" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">Trigger, Condition, Action, Delay</text>
<text x="64" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">drag or click to add</text>
<rect x="48" y="204" width="232" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
